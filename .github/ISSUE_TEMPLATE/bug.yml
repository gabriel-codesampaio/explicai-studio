name: Bug
description: Algo no Studio não funciona como deveria
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Conte o que você fez, o que esperava e o que viu.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para repetir
      placeholder: |
        1. Abri o manual...
        2. Cliquei em...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Studio
      description: Rode `explicai --version`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Sistema e navegador
      placeholder: Windows 11, Chrome 130
  - type: textarea
    id: extra
    attributes:
      label: Mensagens de erro ou prints
      description: Cole o texto do erro. Tire dados sensíveis dos prints.
