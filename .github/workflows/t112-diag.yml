name: T-112 diag
on:
  push:
    branches: [fix/t-112-e2e-ci]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    runs-on: ubuntu-latest
    env:
      E2E_PORT: "4400"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/studio.imagem.e2e.ts -g "Backspace|teclado|Selecion" --repeat-each=10 --reporter=line
      - run: npm run test:e2e
